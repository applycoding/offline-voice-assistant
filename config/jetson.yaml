# Starting point for an NVIDIA Jetson (Orin class, JetPack 6). Not a tuned
# profile and not a benchmark. `device: cuda` assumes a CUDA build of
# CTranslate2. If that wheel is unavailable, set device back to cpu.
# Ollama is the LLM here because a CUDA llama.cpp build is specific to the
# board. Switch llm.backend to llama-cpp if you have that build.
mode: turn
max_tool_rounds: 3

audio:
  sample_rate: 16000
  frame_ms: 30

vad:
  backend: energy
  threshold: 0.02
  silence_ms: 600
  min_speech_ms: 200
  pad_ms: 120

stt:
  backend: faster-whisper
  model: base
  language: en
  device: cuda
  compute_type: int8_float16

llm:
  backend: ollama
  ollama_model: "qwen2.5:0.5b"
  ollama_url: "http://127.0.0.1:11434"
  temperature: 0.2
  max_tokens: 256
  timeout_s: 120

tts:
  backend: piper
  model_path: models/en_US-lessac-medium.onnx
  piper_bin: piper

tools:
  enabled: true
  weather_location: the lab

latency:
  log_path: logs/latency.jsonl
